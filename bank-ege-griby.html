<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Грибы и лишайники — ЕГЭ-2027</title>

<style>
:root {
  --green: #285b43;
  --green-light: #eaf2eb;
  --gold: #c5a052;
  --cream: #faf9f4;
  --text: #28372e;
  --border: #dce5dc;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cream);
  color: var(--text);
  font-family: Arial, sans-serif;
  line-height: 1.55;
}

header {
  background: linear-gradient(120deg,#204b37,#39785a);
  color: white;
  padding: 30px 20px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 0 18px;
}

.logo {
  color: #e7d8ac;
  letter-spacing: 2px;
  font-size: 13px;
}

h1 {
  font-size: 34px;
  margin: 12px 0 5px;
}

.subtitle { color: #e3eee5; }

main { padding: 25px 0 60px; }

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 25px 0;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 11px 16px;
  background: var(--green);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover { opacity: .88; }

.tab {
  background: var(--green-light);
  color: var(--green);
}

.tab.active {
  background: var(--green);
  color: white;
}

.question {
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin: 16px 0;
}

.question-title {
  font-weight: bold;
  margin: 12px 0;
}

.number {
  color: var(--gold);
  font-weight: bold;
}

.option {
  display: block;
  padding: 11px;
  margin: 8px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
}

.option:hover { background: var(--green-light); }

.option input {
  margin-right: 9px;
  accent-color: var(--green);
}

.figure {
  margin: 18px 0;
  padding: 12px;
  background: #fbfcf8;
  border: 1px solid var(--border);
  border-radius: 12px;
}

.figure svg {
  width: 100%;
  height: auto;
  display: block;
}

.caption {
  font-size: 13px;
  color: #68776d;
  margin-top: 8px;
}

.feedback {
  display: none;
  margin-top: 12px;
  padding: 12px;
  background: var(--green-light);
  border-left: 4px solid var(--green);
  border-radius: 7px;
}

.feedback.show { display: block; }

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 25px;
}

.secondary {
  background: #e5e9e5;
  color: var(--green);
}

.result {
  display: none;
  padding: 20px;
  margin-top: 20px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
}

.result.show { display: block; }

.progress {
  height: 8px;
  background: #e1e8e1;
  border-radius: 20px;
  overflow: hidden;
}

.progress span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--gold);
}

footer {
  text-align: center;
  padding: 25px;
  color: #758078;
}

@media(max-width:600px) {
  h1 { font-size: 27px; }
  .question { padding: 15px; }
}
</style>
</head>

<body>

<header>
  <div class="container">
    <div class="logo">БИОЕГЭ С ЛЮБОВЬЮ</div>
    <h1>Грибы и лишайники</h1>
    <div class="subtitle">Банк заданий для подготовки к ЕГЭ-2027</div>
  </div>
</header>

<main class="container">

  <h2>Тренировочный тест</h2>
  <p>Выберите тематический блок и выполните задания.</p>

  <div class="progress">
    <span id="progressBar"></span>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="questions"></div>

  <div class="actions">
    <button onclick="checkBlock()">Проверить блок</button>
    <button class="secondary" onclick="resetBlock()">Сбросить ответы</button>
  </div>

  <div class="result" id="result"></div>

</main>

<footer>
  БиоЕГЭ с любовью · Биология · ЕГЭ-2027
</footer>

<script>

/* ==================================
   НАЗВАНИЯ ТЕМАТИЧЕСКИХ БЛОКОВ
================================== */

const blockNames = [
  "Блок 1. Основы",
  "Блок 2. Размножение",
  "Блок 3. Строение грибов",
  "Блок 4. Значение грибов",

  "Блок 6. Экология",
  "Блок 7. Анализ и эксперименты",
  "Блок 8. Обобщение"
];

/* ==================================
   БАНК ЗАДАНИЙ

   Структура одного задания:

   {
     id: 1,
     block: 1,
     text: "Текст вопроса",
     type: "single",
     options: ["Ответ 1","Ответ 2"],
     answer: ["A"],
     explanation: "Пояснение",
     figure: "mucor"
   }

   type:
   single   — один ответ
   multiple — несколько ответов
   text     — текстовый ответ

   figure:
   mucor, smut, lichen
================================== */

const questions = [
const questions = [
/* БЛОК 1. ЗАДАНИЯ 1–12 */
{id:1,block:1,text:"Какой тип питания характерен для грибов?",type:"single",options:["Автотрофный","Гетеротрофный","Хемотрофный","Фотоавтотрофный"],answer:"2",explanation:"Грибы — гетеротрофные организмы."},
{id:2,block:1,text:"Что представляет собой мицелий большинства многоклеточных грибов?",type:"single",options:["Совокупность плодовых тел","Совокупность спор","Систему ветвящихся гиф","Совокупность клеток водоросли"],answer:"3",explanation:"Мицелий образован системой ветвящихся гиф."},
{id:3,block:1,text:"Выберите три верных утверждения об особенностях клеток грибов.",type:"multi",options:["Клетки грибов имеют клеточную стенку","В клеточной стенке грибов содержится хитин","Все грибы содержат хлоропласты","Грибы имеют оформленное ядро","Клетки всех грибов лишены вакуолей","Грибы относятся к прокариотам"],answer:"124",explanation:"Грибы — эукариоты; клеточная стенка обычно содержит хитин."},
{id:4,block:1,text:"Установите соответствие. А. Мукор; Б. Дрожжи; В. Пеницилл; Г. Шляпочный гриб. 1 — одноклеточный гриб, размножающийся почкованием; 2 — несептированный мицелий и спорангии; 3 — многоклеточный мицелий и кистевидные конидиеносцы; 4 — образует плодовое тело.",type:"text",answer:"2134",explanation:"Мукор — 2, дрожжи — 1, пеницилл — 3, шляпочный гриб — 4."},
{id:5,block:1,text:"Выберите три характеристики, соответствующие мукору.",type:"multi",options:["Имеет несептированный мицелий","Размножается только почкованием","Образует споры в спорангиях","Относится к грибам","Имеет хлоропласты","Образует плодовое тело с шляпкой и ножкой"],answer:"134",explanation:"Мукор имеет несептированный мицелий и образует споры в спорангиях."},
{id:6,block:1,text:"Выберите три способа размножения, встречающиеся у грибов.",type:"multi",options:["Почкование","Образование спор","Фрагментация мицелия","Деление хлоропластов","Образование семян","Формирование цветков"],answer:"123",explanation:"У грибов встречаются почкование, спорообразование и фрагментация мицелия."},
{id:7,block:1,text:"Выберите три верных утверждения о лишайниках.",type:"multi",options:["Лишайник состоит из гриба и фотосинтезирующего партнёра","Грибной компонент поглощает воду и минеральные вещества","Все лишайники имеют корни и листья","Фотосинтезирующим компонентом может быть водоросль или цианобактерия","Лишайники относятся к высшим растениям","Все лишайники фотосинтезируют самостоятельно без партнёра"],answer:"124",explanation:"Лишайник — симбиотическая система гриба и фотосинтезирующего партнёра."},
{id:8,block:1,text:"Установите последовательность этапов развития гриба: 1 — формирование зрелого мицелия; 2 — прорастание споры; 3 — образование споры; 4 — развитие молодых гиф.",type:"text",answer:"3241",explanation:"Спора прорастает, образуются молодые гифы, формируется мицелий, затем возникают структуры спороношения."},
{id:9,block:1,text:"Выберите три верных утверждения о питании грибов.",type:"multi",options:["Грибы поглощают готовые органические вещества","Пищеварение происходит преимущественно вне клеток","Все грибы являются автотрофами","Грибы выделяют ферменты во внешнюю среду","Грибы бывают сапротрофами, паразитами и симбионтами","Грибы синтезируют органические вещества фотосинтезом"],answer:"124",explanation:"Грибы выделяют ферменты и всасывают продукты внеклеточного расщепления."},
{id:10,block:1,text:"Установите последовательность процессов питания сапротрофного гриба: 1 — поглощение растворённых веществ; 2 — выделение ферментов; 3 — расщепление сложных веществ; 4 — поступление продуктов расщепления в клетки.",type:"text",answer:"2341",explanation:"Сначала выделяются ферменты, затем вещества расщепляются и продукты поглощаются."},
{id:11,block:1,text:"Соотнесите экологические группы и источники веществ: А. Сапротрофы; Б. Паразиты; В. Симбионты. 1 — живой организм-хозяин; 2 — мёртвые органические остатки; 3 — организм-партнёр.",type:"text",answer:"213",explanation:"Сапротрофы используют мёртвое органическое вещество, паразиты — ресурсы хозяина, симбионты взаимодействуют с партнёром."},
{id:12,block:1,text:"Выберите два результата спиртового брожения у дрожжей.",type:"multi",options:["Образование этилового спирта","Выделение углекислого газа","Поглощение кислорода","Образование молочной кислоты","Полное окисление глюкозы до углекислого газа и воды"],answer:"12",explanation:"При спиртовом брожении образуются этиловый спирт и углекислый газ."},

/* БЛОК 2. ЗАДАНИЯ 13–22 */
{id:13,block:2,text:"Выберите три верных утверждения о размножении грибов.",type:"multi",options:["Дрожжи могут размножаться почкованием","У многих грибов происходит размножение спорами","Все грибы размножаются исключительно половым путём","Некоторые грибы размножаются частями мицелия","Споры всех грибов образуются только внутри спорангиев","Все грибы размножаются только спорами"],answer:"124",explanation:"Грибы размножаются почкованием, спорами и фрагментами мицелия."},
{id:14,block:2,text:"Установите соответствие: А. Спорангий; Б. Конидиеносец; В. Базидия. 1 — специализированная гифа, на которой образуются конидии; 2 — вместилище, внутри которого формируются споры; 3 — клетка, на которой образуются базидиоспоры.",type:"text",answer:"213",explanation:"Спорангий — 2, конидиеносец — 1, базидия — 3."},
{id:15,block:2,text:"На рисунке представлен плесневый гриб. Выберите три верных утверждения о его строении и жизнедеятельности.",type:"multi",figure:"mucor",options:["Гриб имеет мицелий","Гриб способен к гетеротрофному питанию","Гриб содержит хлорофилл и осуществляет фотосинтез","Гриб может размножаться спорами","Гриб относится к прокариотам","Все клетки гриба лишены ядра"],answer:"124",explanation:"Мицелий, гетеротрофное питание и спорообразование характерны для плесневых грибов."},
{id:16,block:2,text:"При какой температуре наблюдался наибольший рост мицелия? Данные: 10 °C — низкий; 15 °C — умеренный; 25 °C — наибольший; 35 °C — сниженный; 40 °C — отсутствует.",type:"single",options:["10 °C","25 °C","35 °C","40 °C"],answer:"2",explanation:"В описанных экспериментальных условиях максимум роста наблюдался при 25 °C."},
{id:17,block:2,text:"Исследователь изучал влияние влажности на прорастание спор плесневого гриба. Температура и состав среды были одинаковыми. Какую переменную изменяли целенаправленно и какие два условия контролировали?",type:"text",answer:"Влажность; температура и состав питательной среды",explanation:"Влажность — независимая переменная; температуру и состав среды необходимо сохранять постоянными."},
{id:18,block:2,text:"Выберите два верных утверждения об энергетическом обмене грибов.",type:"multi",options:["Грибы способны осуществлять клеточное дыхание","Все грибы получают энергию исключительно за счёт фотосинтеза","Некоторые дрожжи способны осуществлять спиртовое брожение","При спиртовом брожении обязательно используется кислород","Грибы не нуждаются в энергии"],answer:"13",explanation:"Грибы осуществляют клеточное дыхание; некоторые дрожжи способны к спиртовому брожению."},
{id:19,block:2,text:"Установите соответствие: А. Почкование; Б. Фрагментация мицелия; В. Образование конидий; Г. Образование спорангиоспор. 1 — споры внутри вместилища; 2 — вырост на материнской клетке; 3 — размножение частями грибницы; 4 — споры на поверхности специализированных гиф.",type:"text",answer:"2341",explanation:"Почкование — 2, фрагментация — 3, конидии — 4, спорангиоспоры — 1."},
{id:20,block:2,text:"Выберите три верных утверждения о паразитических грибах.",type:"multi",options:["Некоторые вызывают заболевания растений","Получают органические вещества от живого хозяина","Все обязательно убивают хозяина","Некоторые вызывают заболевания животных и человека","Все способны к фотосинтезу","Все поражают исключительно растения"],answer:"124",explanation:"Среди паразитических грибов есть возбудители болезней растений, животных и человека."},
{id:21,block:2,text:"Какой способ бесполого размножения наиболее характерен для многих одноклеточных дрожжей?",type:"single",options:["Почкование","Образование семян","Деление хлоропластов","Формирование плодового тела"],answer:"1",explanation:"Многие дрожжи размножаются почкованием."},
{id:22,block:2,text:"Выберите три верных утверждения о шляпочных грибах.",type:"multi",options:["Их грибница образована гифами","Плодовое тело состоит из корня и побега","На плодовых телах формируются структуры спороношения","Все шляпочные грибы являются паразитами","Большинство имеет грибницу в субстрате","Все способны к фотосинтезу"],answer:"135",explanation:"Шляпочные грибы имеют грибницу и плодовое тело; на гименофоре расположены структуры спороношения."},

/* БЛОК 3. ЗАДАНИЯ 23–32 */
{id:23,block:3,text:"Выберите три верных утверждения о строении шляпочных грибов.",type:"multi",options:["Грибница состоит из гиф","Плодовое тело образовано исключительно корнями","У многих на нижней стороне шляпки расположен гименофор","Все шляпочные грибы одноклеточные","Гименофор несёт гимений, в котором образуются споры","Шляпочные грибы способны к фотосинтезу"],answer:"135",explanation:"Грибница состоит из гиф; гименофор несёт гимений, в котором образуются споры."},
{id:24,block:3,text:"Что называют гименофором шляпочного гриба?",type:"single",options:["Подземную часть грибницы","Часть плодового тела, на которой расположен гимений","Совокупность клеток корневой системы","Наружную оболочку споры"],answer:"2",explanation:"Гименофор — часть плодового тела, несущая гимений."},
{id:25,block:3,text:"Установите соответствие: А. Мукор; Б. Пеницилл; В. Дрожжи; Г. Шляпочный гриб. 1 — многоклеточный мицелий, кистевидные конидиеносцы; 2 — несептированный мицелий, спорангии; 3 — одноклеточная форма, почкование; 4 — плодовое тело и грибница.",type:"text",answer:"2134",explanation:"Мукор — 2, пеницилл — 1, дрожжи — 3, шляпочный гриб — 4."},
{id:26,block:3,text:"Выберите три верных утверждения о плесневых грибах.",type:"multi",options:["Могут развиваться на органических субстратах","Все являются автотрофами","Многие размножаются спорами","Клетки имеют оформленное ядро","Все образуют шляпку и ножку","Относятся к бактериям"],answer:"134",explanation:"Плесневые грибы — эукариотические гетеротрофы, многие размножаются спорами."},
{id:27,block:3,text:"Какая структура характерна для бесполого спороношения пеницилла?",type:"single",options:["Базидия с базидиоспорами","Кистевидный конидиеносец с конидиями","Цветок с семязачатками","Спорангий с подвижными зооспорами"],answer:"2",explanation:"Пеницилл образует конидии на разветвлённых конидиеносцах."},
{id:28,block:3,text:"Выберите три примера паразитических грибов.",type:"multi",options:["Возбудитель головни злаков","Шампиньон на навозе","Дрожжи в хлебопечении","Ржавчинный гриб на листьях","Мукор на пищевых продуктах","Трутовик, поражающий живое дерево"],answer:"146",explanation:"Головня, ржавчинные грибы и некоторые трутовики паразитируют на живых растениях."},
{id:29,block:3,text:"Установите соответствие: А. Пеницилл; Б. Дрожжи; В. Трутовик; Г. Спорынья. 1 — производство некоторых сыров; 2 — хлебопечение; 3 — разрушение древесины; 4 — паразитирование на злаках.",type:"text",answer:"1234",explanation:"Все четыре соответствия отражают использование грибов или их экологическую роль."},
{id:30,block:3,text:"Выберите три верных утверждения о дрожжах.",type:"multi",options:["Многие дрожжи — одноклеточные грибы","Дрожжи способны размножаться почкованием","Все дрожжи фотосинтезируют","Некоторые дрожжи осуществляют спиртовое брожение","Дрожжи относятся к прокариотам","Все дрожжи образуют плодовые тела"],answer:"124",explanation:"Дрожжи — эукариотические грибы; многие размножаются почкованием, некоторые осуществляют брожение."},
{id:31,block:3,text:"Где у мукора формируются споры бесполого размножения?",type:"single",options:["На базидиях","В сумках","В спорангиях","В плодовых телах"],answer:"3",explanation:"У мукора споры бесполого размножения образуются внутри спорангиев."},
{id:32,block:3,text:"Выберите три верных утверждения о базидиальных грибах.",type:"multi",options:["У многих образуются базидиоспоры","Базидиоспоры формируются на базидиях","Все базидиальные грибы одноклеточные","Среди них встречаются шляпочные грибы","Все образуют споры внутри спорангиев","Все являются исключительно сапротрофами"],answer:"124",explanation:"Базидиоспоры формируются на базидиях; среди базидиальных грибов есть шляпочные."},

/* БЛОК 4. ЗАДАНИЯ 33–42 */
{id:33,block:4,text:"Выберите три верных утверждения о строении плодового тела шляпочного гриба.",type:"multi",options:["Образовано плотным переплетением гиф","Является корневой системой","Может включать шляпку и ножку","Гименофор у многих расположен на нижней стороне шляпки","Все клетки способны к фотосинтезу","Образуется только у одноклеточных грибов"],answer:"134",explanation:"Плодовое тело образовано гифами; у многих грибов выделяют шляпку и ножку, а гименофор расположен снизу шляпки."},
{id:34,block:4,text:"Выберите два верных утверждения о трутовиках.",type:"multi",options:["Многие разрушают древесину","Все трутовики одноклеточные","Некоторые развиваются на живых деревьях","Трутовики фотосинтезируют","Все образуют микоризу"],answer:"13",explanation:"Трутовики могут разрушать древесину как живых, так и погибших деревьев."},
{id:35,block:4,text:"Гриб развивается на живом дереве, получает от него органические вещества и вызывает разрушение древесины. Какой тип взаимоотношений описан?",type:"single",options:["Мутуализм","Паразитизм","Комменсализм","Нейтрализм"],answer:"2",explanation:"Гриб получает ресурсы от живого хозяина и наносит ему вред — это паразитизм."},
{id:36,block:4,text:"Выберите три верных утверждения о микоризе.",type:"multi",options:["Взаимодействие гриба и корней растения","Гифы могут увеличивать поглощающую поверхность корней","Растение передаёт грибу органические вещества","Возникает только между грибами и водорослями","Гриб всегда уничтожает корни","Все грибы способны образовывать микоризу"],answer:"123",explanation:"При микоризе гриб и растение обмениваются веществами; гриб помогает корням поглощать воду и минеральные вещества."},
{id:37,block:4,text:"Установите соответствие: А. Шампиньон на навозе; Б. Ржавчинный гриб на листьях; В. Микоризный гриб. 1 — паразит; 2 — сапротроф; 3 — симбионт.",type:"text",answer:"213",explanation:"Шампиньон — сапротроф, ржавчинный гриб — паразит, микоризный гриб — симбионт."},
{id:38,block:4,text:"Выберите три верных утверждения о значении грибов.",type:"multi",options:["Участвуют в разложении органических остатков","Некоторые используются для получения лекарственных веществ","Все грибы вызывают заболевания","Некоторые используются в пищевой промышленности","Не участвуют в круговороте веществ","Оказывают исключительно отрицательное влияние"],answer:"124",explanation:"Грибы важны для разложения органики, медицины и пищевого производства."},
{id:39,block:4,text:"На рисунке изображено заболевание кукурузы. Какой организм является возбудителем кукурузной головни?",type:"single",figure:"smut",options:["Бактерия","Паразитический гриб","Вирус","Одноклеточная водоросль"],answer:"2",explanation:"Кукурузная головня вызывается паразитическим грибом."},
{id:40,block:4,text:"Выберите три верных утверждения о съедобных и ядовитых грибах.",type:"multi",options:["Среди шляпочных грибов есть съедобные и ядовитые виды","Все грибы на деревьях съедобны","Некоторые ядовитые грибы содержат опасные вещества","Внешнее сходство может затруднять различение видов","Все яркие грибы обязательно ядовиты","Термическая обработка делает любые ядовитые грибы безопасными"],answer:"134",explanation:"Существуют съедобные и ядовитые виды; внешний вид сам по себе не гарантирует безопасность."},
{id:41,block:4,text:"Выберите три верных утверждения об экологических ролях грибов.",type:"multi",options:["Сапротрофы разлагают мёртвое органическое вещество","Паразиты получают вещества от живых хозяев","Микоризные грибы обмениваются веществами с корнями","Все грибы являются паразитами","Сапротрофы питаются фотосинтезом","Микориза всегда приводит к гибели растения"],answer:"123",explanation:"Грибы могут быть сапротрофами, паразитами и симбионтами."},
{id:42,block:4,text:"Выберите три верных утверждения об общих признаках грибов.",type:"multi",options:["Грибы относятся к эукариотам","Все грибы способны к фотосинтезу","Клеточная стенка обычно содержит хитин","Грибы поглощают готовые органические вещества","Все грибы многоклеточные","Грибы относятся к прокариотам"],answer:"134",explanation:"Грибы — эукариотические гетеротрофы; их клеточная стенка обычно содержит хитин."},

/* БЛОК 5. ЗАДАНИЯ 43–52 */
{id:43,block:5,text:"Выберите три верных утверждения об общих признаках лишайников.",type:"multi",options:["Лишайник — симбиотическая система гриба и фотосинтезирующего партнёра","Грибной компонент называют микобионтом","Все лишайники имеют корни, стебли и листья","Фотосинтезирующий компонент называют фотобионтом","Лишайники — покрытосеменные растения","Все лишайники состоят только из грибных клеток"],answer:"124",explanation:"Лишайник включает микобионт и фотобионт."},
{id:44,block:5,text:"Установите соответствие: А. Кустистые; Б. Накипные; В. Листоватые. 1 — слоевище в виде кустиков или ветвящихся выростов; 2 — корковидное слоевище, тесно срастающееся с субстратом; 3 — пластинки, прикреплённые к субстрату в отдельных местах.",type:"text",answer:"123",explanation:"Кустистые — 1, накипные — 2, листоватые — 3."},
{id:45,block:5,text:"Выберите три верных утверждения о строении лишайника.",type:"multi",options:["Грибной компонент образует основную часть слоевища","Фотосинтезирующий компонент поглощает органические вещества гриба","Гифы гриба участвуют в поглощении и удержании воды","Фотосинтезирующий компонент образует органические вещества","Слоевище всегда имеет настоящие корни","Грибной компонент самостоятельно фотосинтезирует"],answer:"134",explanation:"Основу слоевища образуют гифы гриба; фотобионт осуществляет фотосинтез; гифы удерживают воду. В редакторской версии встречался другой ключ — требуется финальная сверка."},
{id:46,block:5,text:"Выберите два утверждения, объясняющих использование лишайников для оценки состояния атмосферного воздуха.",type:"multi",options:["Поглощают загрязнители исключительно корнями из почвы","Многие чувствительны к загрязнению воздуха","Некоторые накапливают загрязняющие вещества","Полностью нейтрализуют любые загрязнители","Живут только в условиях сильного загрязнения"],answer:"23",explanation:"Лишайники чувствительны к некоторым загрязнителям и поглощают вещества поверхностью слоевища. В исходной версии задания был указан только один ответ, это исправлено."},
{id:47,block:5,text:"Выберите три верных утверждения об экологических особенностях лишайников.",type:"multi",options:["Могут заселять горные породы","Участвуют в первичном заселении субстратов","Все обитают исключительно в лесах","Некоторые способствуют разрушению горных пород","Не переносят недостаток воды","Могут существовать только при постоянном насыщении водой"],answer:"124",explanation:"Лишайники заселяют разные субстраты, участвуют в первичном заселении и могут разрушать горные породы."},
{id:48,block:5,text:"В одном местообитании преобладали накипные лишайники, в другом — листоватые и кустистые. Какой вывод наиболее обоснован?",type:"single",options:["Накипные формы всегда свидетельствуют о сильном загрязнении","Различия могут быть связаны с условиями среды, но по форме слоевища нельзя достоверно определить загрязнение","Кустистые лишайники встречаются исключительно в городах","Форма слоевища не связана с условиями обитания"],answer:"2",explanation:"По одной жизненной форме нельзя однозначно установить уровень загрязнения."},
{id:49,block:5,text:"Выберите три верных утверждения о значении лишайников.",type:"multi",options:["Могут служить пищей животным","Являются основными продуцентами всех лесных экосистем","Участвуют в первичном заселении субстратов","Могут участвовать в почвообразовании","Все являются паразитами растений","Не влияют на природные сообщества"],answer:"134",explanation:"Лишайники участвуют в пищевых цепях, первичном заселении и почвообразовании."},
{id:50,block:5,text:"В двух районах обнаружили 18 и 5 видов лишайников. Во втором районе загрязнение воздуха было выше. Какой вывод наиболее обоснован?",type:"single",options:["Данные указывают на связь загрязнения с уменьшением видового разнообразия","Загрязнение обязательно является единственной причиной","Уменьшение числа видов доказывает исчезновение всех грибов","Разнообразие лишайников не зависит от среды"],answer:"1",explanation:"Наблюдения показывают связь, но сами по себе не доказывают причинность."},
{id:51,block:5,text:"Выберите три фактора, влияющих на распространение лишайников.",type:"multi",options:["Влажность среды","Освещённость","Характер субстрата","Наличие цветков у соседних растений","Наличие семян в почве","Способность образовывать плоды с семенами"],answer:"123",explanation:"На распространение лишайников влияют влажность, освещённость и свойства субстрата."},
{id:52,block:5,text:"Установите соответствие: А. Грибной и фотосинтезирующий компоненты лишайника; Б. Гриб и корни растения при микоризе; В. Гриб-паразит и растение-хозяин; Г. Сапротрофный гриб и отмершие остатки. 1 — мутуализм; 2 — паразитизм; 3 — сапротрофное питание.",type:"text",answer:"1123",explanation:"Лишайник и микориза — мутуализм; паразитирование — паразитизм; использование мёртвых остатков — сапротрофное питание."},

/* БЛОК 6. ЗАДАНИЯ 53–62 */
{id:53,block:6,text:"Выберите три верных утверждения о роли грибов в природе.",type:"multi",options:["Участвуют в разложении органических остатков","Некоторые образуют микоризу","Все являются продуцентами","Некоторые вызывают заболевания растений и животных","Не участвуют в круговороте веществ","Все ведут паразитический образ жизни"],answer:"124",explanation:"Грибы участвуют в разложении органики, симбиотических отношениях и паразитизме."},
{id:54,block:6,text:"Установите соответствие: А. Мукор на пищевых остатках; Б. Ржавчинный гриб на листьях; В. Микоризный гриб; Г. Шампиньон на навозе. 1 — сапротроф; 2 — паразит; 3 — симбионт.",type:"text",answer:"1231",explanation:"Мукор и шампиньон — сапротрофы; ржавчинный гриб — паразит; микоризный гриб — симбионт. В поздней преподавательской редакции встречался иной ключ из-за другой нумерации вариантов."},
{id:55,block:6,text:"Что является источником органических веществ для сапротрофных грибов?",type:"single",options:["Углекислый газ атмосферы","Мёртвые органические остатки","Минеральные соли","Солнечная энергия"],answer:"2",explanation:"Сапротрофы используют мёртвое органическое вещество."},
{id:56,block:6,text:"Выберите три верных утверждения о грибах и круговороте веществ.",type:"multi",options:["Участвуют в разложении сложных органических веществ","При разложении вещества возвращаются в круговорот","Превращают минеральные вещества в органические фотосинтезом","Способствуют высвобождению минеральных веществ","Не взаимодействуют с другими компонентами экосистем","Прекращают разложение после образования спор"],answer:"124",explanation:"Грибы разлагают органические вещества и участвуют в возвращении элементов в круговорот."},
{id:57,block:6,text:"Какую экологическую роль выполняют грибы, разрушающие древесину погибших деревьев?",type:"single",options:["Продуценты","Сапротрофы","Первичные консументы","Автотрофы"],answer:"2",explanation:"Сапротрофные грибы разлагают древесину погибших деревьев."},
{id:58,block:6,text:"Выберите три верных утверждения о лишайниках в экосистемах.",type:"multi",options:["Могут участвовать в первичном заселении субстратов","Некоторые животные используют их в пищу","Могут способствовать формированию почвы","Все являются паразитами деревьев","Не способны существовать на скалах","Не участвуют в природных сообществах"],answer:"123",explanation:"Лишайники участвуют в первичном заселении, пищевых цепях и почвообразовании."},
{id:59,block:6,text:"В районе А обнаружили 16 видов лишайников, в районе Б — 6. В районе Б концентрация загрязнителей выше. Какой вывод наиболее обоснован?",type:"single",options:["Возможна связь загрязнения воздуха с уменьшением разнообразия лишайников","Загрязнение — единственная причина различий","Все лишайники района Б обязательно погибли","Разнообразие не зависит от состояния воздуха"],answer:"1",explanation:"Наблюдения позволяют предположить связь, но не устанавливают единственную причину различий. Задание тематически близко к №50."},
{id:60,block:6,text:"Выберите три фактора, способных влиять на распространение лишайников.",type:"multi",options:["Влажность","Освещённость","Характер поверхности субстрата","Наличие семян у соседних растений","Наличие цветков у соседних растений","Образование плодов с семенами"],answer:"123",explanation:"Влажность, освещённость и свойства субстрата влияют на распространение лишайников."},
{id:61,block:6,text:"Установите соответствие: А. Грибной и фотосинтезирующий компоненты лишайника; Б. Гриб и корни растения при микоризе; В. Гриб-паразит и живое растение; Г. Гриб, питающийся остатками погибшего организма. 1 — мутуализм; 2 — паразитизм; 3 — сапротрофное питание.",type:"text",answer:"1123",explanation:"Лишайник и микориза — мутуализм; паразитирование — паразитизм; питание мёртвыми остатками — сапротрофия. В поздней преподавательской версии ключ расходился с этим вариантом."},
{id:62,block:6,text:"Какую роль могут играть лишайники на начальных этапах первичной сукцессии на голых горных породах?",type:"single",options:["Полностью прекращают разрушение породы","Заселяют субстрат, участвуют в его разрушении и накоплении органического вещества","Образуют семена и цветки","Уничтожают все микроорганизмы субстрата"],answer:"2",explanation:"Лишайники заселяют голые породы и участвуют в начальных этапах почвообразования."},

/* БЛОК 7. ЗАДАНИЯ 63–72 */
{id:63,block:7,text:"Выберите три верных утверждения об общих признаках грибов.",type:"multi",options:["Грибы имеют клеточное строение","Все грибы содержат хлорофилл","Грибы — эукариоты","Клеточная стенка многих грибов содержит хитин","Все грибы синтезируют органические вещества из углекислого газа","Грибы — прокариоты"],answer:"134",explanation:"Грибы — эукариоты с клеточной стенкой; большинство питается готовыми органическими веществами."},
{id:64,block:7,text:"Установите соответствие: А. Базидия; Б. Сумка; В. Спорангий; Г. Конидиеносец. 1 — структура, на которой формируются конидии; 2 — клетка, на которой образуются базидиоспоры; 3 — структура, внутри которой формируются аскоспоры; 4 — вместилище, внутри которого образуются споры.",type:"text",answer:"2341",explanation:"Базидия — 2, сумка — 3, спорангий — 4, конидиеносец — 1."},
{id:65,block:7,text:"Выберите два верных утверждения об устойчивости лишайников к высыханию.",type:"multi",options:["Многие переносят значительную потерю воды и восстанавливаются после увлажнения","При высыхании жизненные процессы могут резко замедляться","Все лишайники погибают при кратковременном недостатке воды","Поглощают воду исключительно корнями","Высыхание всегда необратимо разрушает клетки"],answer:"12",explanation:"Многие лишайники способны переносить высыхание; при увлажнении их жизнедеятельность восстанавливается."},

function getFigure(name) {
  if (name === "mucor") return drawMucor();
  if (name === "smut") return drawSmut();
  if (name === "lichen") return drawLichen();
  return "";
}

/* ==================================
   ИНТЕРФЕЙС БЛОКОВ
================================== */

let currentBlock = 1;
const userAnswers = {};

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";

  blockNames.forEach((name, index) => {
    const button = document.createElement("button");
    button.className = "tab" +
      (currentBlock === index + 1 ? " active" : "");

    button.textContent = name;
    button.onclick = () => {
      currentBlock = index + 1;
      renderTabs();
      renderQuestions();
    };

    tabs.appendChild(button);
  });
}

/* ==================================
   ОТОБРАЖЕНИЕ ЗАДАНИЙ
================================== */

function renderQuestions() {
  const root = document.getElementById("questions");
  const list = questions.filter(q => q.block === currentBlock);

  document.getElementById("result").classList.remove("show");

  if (list.length === 0) {
    root.innerHTML = `
      <div class="question">
        <h3>${blockNames[currentBlock - 1]}</h3>
        <p>Задания этого блока будут добавлены из авторского банка.</p>
        <p>Всего в проекте предусмотрено 81 задание.</p>
      </div>`;
    return;
  }

  root.innerHTML = "";

  list.forEach(q => {
    const card = document.createElement("div");
    card.className = "question";

    const inputType =
      q.type === "multiple" ? "checkbox" : "radio";

    let controls = "";

    if (q.type === "text") {
      controls = `
        <textarea
          data-q="${q.id}"
          rows="4"
          style="width:100%;padding:10px;border:1px solid #dce5dc;border-radius:8px"
          placeholder="Введите ответ"></textarea>`;
    } else {
      controls = q.options.map((option, index) => {
        const letter = String.fromCharCode(65 + index);

        return `
          <label class="option">
            <input
              type="${inputType}"
              name="q${q.id}"
              value="${letter}"
              data-q="${q.id}">
            <strong>${letter}.</strong> ${option}
          </label>`;
      }).join("");
    }

    card.innerHTML = `
      <div class="number">Задание № ${q.id}</div>
      <div class="question-title">${q.text}</div>
      ${q.figure ? getFigure(q.figure) : ""}
      ${controls}
      <div class="feedback" id="feedback-${q.id}"></div>
    `;

    root.appendChild(card);
  });

  root.querySelectorAll("input, textarea").forEach(input => {
    input.addEventListener("change", saveAnswer);
  });
}

/* ==================================
   СОХРАНЕНИЕ ОТВЕТОВ
================================== */

function saveAnswer(event) {
  const id = event.target.dataset.q;
  if (!id) return;

  if (event.target.type === "checkbox") {
    userAnswers[id] = [
      ...document.querySelectorAll(
        `input[data-q="${id}"]:checked`
      )
    ].map(input => input.value);

  } else {
    userAnswers[id] = event.target.value;
  }
}

/* ==================================
   ПРОВЕРКА БЛОКА
================================== */

function checkBlock() {
  const list = questions.filter(q => q.block === currentBlock);

  if (!list.length) {
    alert("В этом блоке пока нет добавленных заданий.");
    return;
  }

  let correct = 0;
  let checked = 0;
  let manual = 0;

  list.forEach(q => {
    const feedback = document.getElementById(
      `feedback-${q.id}`
    );

    if (!feedback) return;

    feedback.classList.add("show");

    if (q.type === "text") {
      manual++;
      feedback.textContent =
        "Развёрнутый ответ требует проверки преподавателем.";
      return;
    }

    const selected = userAnswers[q.id] || [];
    const expected = q.answer || [];

    const selectedArray = Array.isArray(selected)
      ? selected
      : [selected];

    const isCorrect =
      selectedArray.length === expected.length &&
      selectedArray.every(value => expected.includes(value));

    checked++;

    if (isCorrect) correct++;

    feedback.textContent =
      (isCorrect ? "Верно! " : "Ответ неверный. ") +
      (q.explanation || "");
  });

  const result = document.getElementById("result");
  result.classList.add("show");

  result.innerHTML = `
    <h3>Результат выполнения блока</h3>
    <p><strong>${correct} из ${checked}</strong> заданий выполнено верно.</p>
    ${manual ? `<p>${manual} заданий требуют ручной проверки.</p>` : ""}
  `;
}
