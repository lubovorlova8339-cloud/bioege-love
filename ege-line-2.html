<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Линия 2 — БИОЕГЭ с Любовью</title>

<style>
:root {
  --green: #315c45;
  --green2: #47785a;
  --gold: #c5a45c;
  --cream: #faf9f4;
  --white: #ffffff;
  --text: #29372e;
  --muted: #778278;
  --border: #e4e8df;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--text);
  font-family: Arial, sans-serif;
  line-height: 1.6;
}
header {
  background: var(--green);
  color: white;
  padding: 27px 18px;
  text-align: center;
  border-bottom: 4px solid var(--gold);
}
header h1 {
  margin: 0;
  font-size: 27px;
}
header p {
  margin: 7px 0 0;
  color: #e5eadf;
}
.container {
  max-width: 950px;
  margin: 25px auto;
  padding: 0 15px 50px;
}
.top-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
a.back {
  color: var(--green);
  text-decoration: none;
  font-weight: bold;
}
.progress-box {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px 18px;
  margin-bottom: 22px;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 14px;
  color: var(--muted);
}
.progress-track {
  height: 9px;
  background: #e9ede7;
  border-radius: 20px;
  margin-top: 10px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: var(--green2);
  transition: width .3s;
}
.task {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(40,60,40,.04);
}
.task h2 {
  color: var(--green);
  font-size: 19px;
  margin: 0 0 13px;
}
.task p { margin: 10px 0; }
.values {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 10px;
  margin: 16px 0;
}
.value {
  background: #f5f7f1;
  border: 1px solid #e4e9df;
  border-radius: 9px;
  padding: 12px;
  font-size: 14px;
}
.options {
  background: #fbfaf6;
  border-left: 3px solid var(--gold);
  padding: 10px 14px;
  margin: 14px 0;
  font-size: 14px;
}
.answer-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
}
.answer-row label { font-weight: bold; }
.answer-input {
  width: 100px;
  padding: 11px;
  border: 1px solid #cbd5c9;
  border-radius: 8px;
  font-size: 18px;
  text-align: center;
  letter-spacing: 5px;
}
button {
  border: none;
  border-radius: 8px;
  padding: 11px 17px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}
.check-btn {
  background: var(--green);
  color: white;
}
.solution-btn {
  background: #eee9dc;
  color: #66552f;
}
button:hover { opacity: .9; }
.feedback {
  margin-top: 13px;
  font-weight: bold;
  font-size: 14px;
}
.correct { color: #287447; }
.incorrect { color: #b34b3e; }
.solution {
  display: none;
  margin-top: 15px;
  padding: 15px;
  background: #f3f7f0;
  border-radius: 9px;
  border-left: 4px solid var(--green2);
  font-size: 14px;
}
.solution strong { color: var(--green); }
footer {
  text-align: center;
  padding: 25px;
  color: var(--muted);
  font-size: 13px;
}
.reset-btn {
  background: #eee;
  color: #555;
}
@media(max-width:600px) {
  header h1 { font-size: 22px; }
  .task { padding: 17px; }
  .values { grid-template-columns: 1fr; }
  .answer-row { align-items: stretch; }
}
</style>
</head>

<body>

<header>
  <h1>БИОЕГЭ с Любовью</h1>
  <p>Линия 2. Биологический эксперимент</p>
</header>

<main class="container">

  <div class="top-actions">
    <a class="back" href="./bank-ege.html">← Назад в банк ЕГЭ</a>
    <button class="reset-btn" onclick="resetProgress()">Сбросить прогресс</button>
  </div>

  <div class="progress-box">
    <div class="progress-info">
      <span>Выполнено: <b id="done">0</b> из 26</span>
      <span>Правильных ответов: <b id="score">0</b></span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress"></div>
    </div>
  </div>

  <div id="tasks"></div>

</main>

<footer>БИОЕГЭ с Любовью · Подготовка к ЕГЭ по биологии</footer>

<script>

const storageKey = "bioege_line2_progress_v1";
let saved = {};

try {
  saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
} catch(e) {
  saved = {};
}

const root = document.getElementById("tasks");

function renderTasks() {
  root.innerHTML = "";

  tasks.forEach((t, i) => {
    const item = document.createElement("article");
    item.className = "task";

    item.innerHTML = `
      <h2>Задание ${i + 1}</h2>
      <p>${t.q}</p>

      <div class="values">
        ${t.v.map(v => `<div class="value">${v}</div>`).join("")}
      </div>

      <div class="options">
        <b>Варианты изменения:</b><br>
        1 — увеличилось<br>
        2 — уменьшилось<br>
        3 — не изменилось
      </div>

      <div class="answer-row">
        <label for="answer-${i}">Твой ответ:</label>
        <input
          class="answer-input"
          id="answer-${i}"
          type="text"
          inputmode="numeric"
          maxlength="2"
          placeholder="__"
          autocomplete="off"
        >
        <button class="check-btn" onclick="checkAnswer(${i})">Проверить</button>
        <button class="solution-btn" onclick="toggleSolution(${i})">Показать решение</button>
      </div>

      <div class="feedback" id="feedback-${i}"></div>

      <div class="solution" id="solution-${i}">
        <strong>Правильный ответ: ${t.a}</strong>
        <p>${t.s}</p>
      </div>
    `;

    root.appendChild(item);

    if (saved[i]) {
      document.getElementById(`answer-${i}`).value = saved[i].answer || "";
      if (saved[i].checked) {
        showFeedback(i, saved[i].correct);
      }
    }
  });

  updateProgress();
}

function checkAnswer(i) {
  const input = document.getElementById(`answer-${i}`);
  const value = input.value.trim();

  if (!/^[1-3]{2}$/.test(value)) {
    const feedback = document.getElementById(`feedback-${i}`);
    feedback.className = "feedback incorrect";
    feedback.textContent = "Введи две цифры: от 1 до 3.";
    return;
  }

  const correct = value === tasks[i].a;

  saved[i] = {
    answer: value,
    checked: true,
    correct: correct
  };

  saveProgress();
  showFeedback(i, correct);
  updateProgress();
}

function showFeedback(i, correct) {
  const feedback = document.getElementById(`feedback-${i}`);

  if (correct) {
    feedback.className = "feedback correct";
    feedback.textContent = "✓ Верно! Отличная работа.";
  } else {
    feedback.className = "feedback incorrect";
    feedback.textContent = "Ответ неверный. Попробуй ещё раз или открой решение.";
  }
}

function toggleSolution(i) {
  const box = document.getElementById(`solution-${i}`);
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function saveProgress() {
  localStorage.setItem(storageKey, JSON.stringify(saved));
}

function updateProgress() {
  const checked = Object.values(saved).filter(x => x.checked);
  const correct = checked.filter(x => x.correct).length;

  document.getElementById("done").textContent = checked.length;
  document.getElementById("score").textContent = correct;
  document.getElementById("progress").style.width =
    (checked.length / tasks.length * 100) + "%";
}

function resetProgress() {
  if (!confirm("Сбросить все ответы и прогресс?")) return;

  saved = {};
  localStorage.removeItem(storageKey);
  renderTasks();
}

renderTasks();
</script>

</body>
</html>
