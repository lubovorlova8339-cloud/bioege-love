
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Грибы и лишайники — ЕГЭ-2027</title>

<style>
:root {
  --green: #285b43;
  --green-light: #eaf2eb;
  --gold: #c5a052;
  --cream: #faf9f4;
  --text: #28372e;
  --border: #dce5dc;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cream);
  color: var(--text);
  font-family: Arial, sans-serif;
  line-height: 1.55;
}

header {
  background: linear-gradient(120deg,#204b37,#39785a);
  color: white;
  padding: 30px 20px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 0 18px;
}

.logo {
  color: #e7d8ac;
  letter-spacing: 2px;
  font-size: 13px;
}

h1 {
  font-size: 34px;
  margin: 12px 0 5px;
}

.subtitle { color: #e3eee5; }

main { padding: 25px 0 60px; }

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 25px 0;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 11px 16px;
  background: var(--green);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover { opacity: .88; }

.tab {
  background: var(--green-light);
  color: var(--green);
}

.tab.active {
  background: var(--green);
  color: white;
}

.question {
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin: 16px 0;
}

.question-title {
  font-weight: bold;
  margin: 12px 0;
}

.number {
  color: var(--gold);
  font-weight: bold;
}

.option {
  display: block;
  padding: 11px;
  margin: 8px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
}

.option:hover { background: var(--green-light); }

.option input {
  margin-right: 9px;
  accent-color: var(--green);
}

.figure {
  margin: 18px 0;
  padding: 12px;
  background: #fbfcf8;
  border: 1px solid var(--border);
  border-radius: 12px;
}

.figure svg {
  width: 100%;
  height: auto;
  display: block;
}

.caption {
  font-size: 13px;
  color: #68776d;
  margin-top: 8px;
}

.feedback {
  display: none;
  margin-top: 12px;
  padding: 12px;
  background: var(--green-light);
  border-left: 4px solid var(--green);
  border-radius: 7px;
}

.feedback.show { display: block; }

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 25px;
}

.secondary {
  background: #e5e9e5;
  color: var(--green);
}

.result {
  display: none;
  padding: 20px;
  margin-top: 20px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
}

.result.show { display: block; }

.progress {
  height: 8px;
  background: #e1e8e1;
  border-radius: 20px;
  overflow: hidden;
}

.progress span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--gold);
}

footer {
  text-align: center;
  padding: 25px;
  color: #758078;
}

@media(max-width:600px) {
  h1 { font-size: 27px; }
  .question { padding: 15px; }
}
</style>
</head>

<body>

<header>
  <div class="container">
    <div class="logo">БИОЕГЭ С ЛЮБОВЬЮ</div>
    <h1>Грибы и лишайники</h1>
    <div class="subtitle">Банк заданий для подготовки к ЕГЭ-2027</div>
  </div>
</header>

<main class="container">

  <h2>Тренировочный тест</h2>
  <p>Выберите тематический блок и выполните задания.</p>

  <div class="progress">
    <span id="progressBar"></span>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="questions"></div>

  <div class="actions">
    <button onclick="checkBlock()">Проверить блок</button>
    <button class="secondary" onclick="resetBlock()">Сбросить ответы</button>
  </div>

  <div class="result" id="result"></div>

</main>

<footer>
  БиоЕГЭ с любовью · Биология · ЕГЭ-2027
</footer>

<script>

/* ==================================
   НАЗВАНИЯ ТЕМАТИЧЕСКИХ БЛОКОВ
================================== */

const blockNames = [
  "Блок 1. Основы",
  "Блок 2. Размножение",
  "Блок 3. Строение грибов",
  "Блок 4. Значение грибов",
  "Блок 5. Лишайники",
  "Блок 6. Экология",
  "Блок 7. Анализ и эксперименты",
  "Блок 8. Обобщение"
];

/* ==================================
   БАНК ЗАДАНИЙ

   Структура одного задания:

   {
     id: 1,
     block: 1,
     text: "Текст вопроса",
     type: "single",
     options: ["Ответ 1","Ответ 2"],
     answer: ["A"],
     explanation: "Пояснение",
     figure: "mucor"
   }

   type:
   single   — один ответ
   multiple — несколько ответов
   text     — текстовый ответ

   figure:
   mucor, smut, lichen
================================== */

const questions = [

  /*
  ЗАДАНИЯ ДОБАВЛЯЮТСЯ СЮДА.

  Пример структуры:

  {
    id: 1,
    block: 1,
    text: "Какой тип питания характерен для большинства грибов?",
    type: "single",
    options: [
      "Автотрофный",
      "Гетеротрофный",
      "Хемосинтетический",
      "Фотоавтотрофный"
    ],
    answer: ["B"],
    explanation: "Грибы являются гетеротрофными организмами."
  }
  */

];

/* ==================================
   РИСУНОК 1. МУКОР
================================== */

function drawMucor() {
return `
<div class="figure">
<svg viewBox="0 0 700 310" role="img"
aria-label="Строение мукора">

<rect width="700" height="310" rx="12" fill="#f7faf5"/>

<!-- Мицелий -->
<g stroke="#477b59" stroke-width="5"
fill="none" stroke-linecap="round">
  <path d="M50 245 Q110 205 160 235
  T270 225 T380 240 T500 220 T650 240"/>
  <path d="M180 230 Q190 180 230 160
  Q260 145 300 160"/>
  <path d="M390 235 Q400 180 400 95"/>
  <path d="M400 95 Q370 75 350 65"/>
  <path d="M400 95 Q425 70 450 65"/>
</g>

<!-- Спорангий -->
<circle cx="400" cy="55" r="35"
fill="#d7b76b" stroke="#8c6c30" stroke-width="3"/>

<g fill="#8c6c30">
  <circle cx="385" cy="42" r="4"/>
  <circle cx="405" cy="30" r="4"/>
  <circle cx="420" cy="50" r="4"/>
  <circle cx="390" cy="65" r="4"/>
  <circle cx="410" cy="72" r="4"/>
  <circle cx="375" cy="58" r="4"/>
</g>

<!-- Подписи -->
<g font-family="Arial" font-size="19" fill="#26352d">
  <text x="485" y="35">Спорангий</text>
  <text x="485" y="115">Спороносная ножка</text>
  <text x="35" y="115">Гифы мицелия</text>
  <text x="520" y="280">Мицелий</text>
</g>

<g stroke="#52685a" stroke-width="2" fill="none">
  <path d="M460 40 L435 48"/>
  <path d="M475 110 L405 120"/>
  <path d="M145 120 L210 180"/>
  <path d="M515 265 L550 240"/>
</g>

</svg>
<div class="caption">
Схема строения мукора. Мицелий образован разветвлёнными гифами;
бесполое размножение происходит с помощью спор, формирующихся
в спорангии.
</div>
</div>`;
}

/* ==================================
   РИСУНОК 2. КУКУРУЗНАЯ ГОЛОВНЯ
================================== */

function drawSmut() {
return `
<div class="figure">
<svg viewBox="0 0 700 310" role="img"
aria-label="Кукуруза, поражённая головнёй">

<rect width="700" height="310" rx="12" fill="#f7faf5"/>

<!-- Здоровый початок -->
<path d="M110 245 Q65 140 135 65
Q190 15 260 65 Q315 135 265 245Z"
fill="#78a66b" stroke="#477b59" stroke-width="3"/>

<path d="M155 240 Q125 145 165 75
Q205 40 240 75 Q275 145 235 240Z"
fill="#e0c36d" stroke="#a68b3e" stroke-width="3"/>

<g fill="#f5df99" stroke="#b99b50">
  <ellipse cx="180" cy="100" rx="12" ry="17"/>
  <ellipse cx="215" cy="100" rx="12" ry="17"/>
  <ellipse cx="175" cy="140" rx="12" ry="17"/>
  <ellipse cx="210" cy="140" rx="12" ry="17"/>
  <ellipse cx="175" cy="180" rx="12" ry="17"/>
  <ellipse cx="210" cy="180" rx="12" ry="17"/>
</g>

<!-- Поражённый початок -->
<path d="M390 245 Q345 150 405 75
Q465 15 535 75 Q590 150 535 245Z"
fill="#9a6250" stroke="#633c32" stroke-width="3"/>

<path d="M410 220 Q390 150 435 95
Q485 55 530 105 Q555 170 510 230Z"
fill="#554039"/>

<g fill="#302a27">
  <circle cx="440" cy="125" r="5"/>
  <circle cx="470" cy="105" r="5"/>
  <circle cx="500" cy="130" r="5"/>
  <circle cx="520" cy="165" r="5"/>
  <circle cx="480" cy="190" r="5"/>
  <circle cx="445" cy="175" r="5"/>
</g>

<g font-family="Arial" font-size="19" fill="#26352d">
  <text x="105" y="285">Здоровый початок</text>
  <text x="385" y="285">Поражённый початок</text>
</g>

</svg>
<div class="caption">
Схематическое сравнение здорового початка кукурузы
и початка, поражённого грибом — возбудителем головни.

</div>`;

/* ==================================
   РИСУНОК 3. СЛОЕВИЩЕ ЛИШАЙНИКА
================================== */

function drawLichen() {
return `
<div class="figure">
<svg viewBox="0 0 700 350" role="img"
aria-label="Поперечный срез слоевища лишайника">

<rect width="700" height="350" rx="12" fill="#f7faf5"/>

<!-- Верхняя кора -->
<rect x="150" y="45" width="430" height="48"
rx="8" fill="#b6a36a" stroke="#827343" stroke-width="2"/>

<!-- Гонидиальный слой -->
<rect x="150" y="93" width="430" height="65"
fill="#e9e3c9"/>

<g fill="#65985a">
  <circle cx="185" cy="118" r="10"/>
  <circle cx="235" cy="135" r="10"/>
  <circle cx="290" cy="115" r="10"/>
  <circle cx="350" cy="137" r="10"/>
  <circle cx="410" cy="115" r="10"/>
  <circle cx="470" cy="135" r="10"/>
  <circle cx="535" cy="115" r="10"/>
</g>

<!-- Сердцевина -->
<rect x="150" y="158" width="430" height="105"
fill="#f0eddf"/>

<g fill="none" stroke="#9a8960" stroke-width="3">
  <path d="M165 185 Q210 165 250 205
  T340 185 T430 210 T520 180"/>
  <path d="M165 235 Q220 210 270 240
  T370 225 T470 245 T560 220"/>
</g>

<!-- Нижняя кора -->
<rect x="150" y="263" width="430" height="38"
fill="#c9b98b" stroke="#827343" stroke-width="2"/>

<!-- Подписи -->
<g font-family="Arial" font-size="18" fill="#26352d">
  <text x="20" y="75">Верхняя кора</text>
  <text x="20" y="125">Гонидиальный слой</text>
  <text x="20" y="210">Сердцевина</text>
  <text x="20" y="288">Нижняя кора</text>
</g>

<g stroke="#52685a" stroke-width="2">
  <path d="M130 70 L150 70"/>
  <path d="M130 120 L150 120"/>
  <path d="M130 205 L150 205"/>
  <path d="M130 280 L150 280"/>
</g>

<text x="365" y="330" text-anchor="middle"
font-family="Arial" font-size="15" fill="#68776d">
Поперечный срез гетеромерного слоевища
</text>

</svg>
<div class="caption">
Схема гетеромерного слоевища лишайника.
Зелёные клетки в гонидиальном слое — клетки фотобионта.
</div>
</div>`;
}

/* ==================================
   ВСТАВКА РИСУНКОВ
================================== */

function getFigure(name) {
  if (name === "mucor") return drawMucor();
  if (name === "smut") return drawSmut();
  if (name === "lichen") return drawLichen();
  return "";
}

/* ==================================
   ИНТЕРФЕЙС БЛОКОВ
================================== */

let currentBlock = 1;
const userAnswers = {};

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";

  blockNames.forEach((name, index) => {
    const button = document.createElement("button");
    button.className = "tab" +
      (currentBlock === index + 1 ? " active" : "");

    button.textContent = name;
    button.onclick = () => {
      currentBlock = index + 1;
      renderTabs();
      renderQuestions();
    };

    tabs.appendChild(button);
  });
}

/* ==================================
   ОТОБРАЖЕНИЕ ЗАДАНИЙ
================================== */

function renderQuestions() {
  const root = document.getElementById("questions");
  const list = questions.filter(q => q.block === currentBlock);

  document.getElementById("result").classList.remove("show");

  if (list.length === 0) {
    root.innerHTML = `
      <div class="question">
        <h3>${blockNames[currentBlock - 1]}</h3>
        <p>Задания этого блока будут добавлены из авторского банка.</p>
        <p>Всего в проекте предусмотрено 81 задание.</p>
      </div>`;
    return;
  }

  root.innerHTML = "";

  list.forEach(q => {
    const card = document.createElement("div");
    card.className = "question";

    const inputType =
      q.type === "multiple" ? "checkbox" : "radio";

    let controls = "";

    if (q.type === "text") {
      controls = `
        <textarea
          data-q="${q.id}"
          rows="4"
          style="width:100%;padding:10px;border:1px solid #dce5dc;border-radius:8px"
          placeholder="Введите ответ"></textarea>`;
    } else {
      controls = q.options.map((option, index) => {
        const letter = String.fromCharCode(65 + index);

        return `
          <label class="option">
            <input
              type="${inputType}"
              name="q${q.id}"
              value="${letter}"
              data-q="${q.id}">
            <strong>${letter}.</strong> ${option}
          </label>`;
      }).join("");
    }

    card.innerHTML = `
      <div class="number">Задание № ${q.id}</div>
      <div class="question-title">${q.text}</div>
      ${q.figure ? getFigure(q.figure) : ""}
      ${controls}
      <div class="feedback" id="feedback-${q.id}"></div>
    `;

    root.appendChild(card);
  });

  root.querySelectorAll("input, textarea").forEach(input => {
    input.addEventListener("change", saveAnswer);
  });
}

/* ==================================
   СОХРАНЕНИЕ ОТВЕТОВ
================================== */

function saveAnswer(event) {
  const id = event.target.dataset.q;
  if (!id) return;

  if (event.target.type === "checkbox") {
    userAnswers[id] = [
      ...document.querySelectorAll(
        `input[data-q="${id}"]:checked`
      )
    ].map(input => input.value);

  } else {
    userAnswers[id] = event.target.value;
  }
}

/* ==================================
   ПРОВЕРКА БЛОКА
================================== */

function checkBlock() {
  const list = questions.filter(q => q.block === currentBlock);

  if (!list.length) {
    alert("В этом блоке пока нет добавленных заданий.");
    return;
  }

  let correct = 0;
  let checked = 0;
  let manual = 0;

  list.forEach(q => {
    const feedback = document.getElementById(
      `feedback-${q.id}`
    );

    if (!feedback) return;

    feedback.classList.add("show");

    if (q.type === "text") {
      manual++;
      feedback.textContent =
        "Развёрнутый ответ требует проверки преподавателем.";
      return;
    }

    const selected = userAnswers[q.id] || [];
    const expected = q.answer || [];

    const selectedArray = Array.isArray(selected)
      ? selected
      : [selected];

    const isCorrect =
      selectedArray.length === expected.length &&
      selectedArray.every(value => expected.includes(value));

    checked++;

    if (isCorrect) correct++;

    feedback.textContent =
      (isCorrect ? "Верно! " : "Ответ неверный. ") +
      (q.explanation || "");
  });

  const result = document.getElementById("result");
  result.classList.add("show");

  result.innerHTML = `
    <h3>Результат выполнения блока</h3>
    <p><strong>${correct} из ${checked}</strong> заданий выполнено верно.</p>
    ${manual ? `<p>${manual} заданий требуют ручной проверки.</p>` : ""}
  `;
}

/* ==================================
   СБРОС ОТВЕТОВ
================================== */

function resetBlock() {
  questions
    .filter(q => q.block === currentBlock)
    .forEach(q => delete userAnswers[q.id]);

  renderQuestions();
}

renderTabs();
renderQuestions();

</script>
</body>
</html>
