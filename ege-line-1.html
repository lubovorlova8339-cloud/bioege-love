const storageKey = "bioege_line1_progress_v1";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(storageKey) || "{}"); }
catch(e) { progress = {}; }

function normalize(value){
 return String(value || "")
  .toLowerCase()
  .replaceAll("ё","е")
  .replace(/[.,!?;:()[\]«»"'`]/g," ")
  .replace(/\s+/g," ")
  .trim();
}

function acceptedAnswers(answerText){
 return answerText.split(";").map(x=>normalize(x)).filter(Boolean);
}

function isCorrect(userAnswer, answerText){
 const user = normalize(userAnswer);
 if(!user) return false;
 return acceptedAnswers(answerText).some(answer => user === answer);
}

    </div>
    <div class="q-text">${question}</div>
    ${needsImage ? '<div class="image-note">В исходном задании предусмотрена иллюстрация. Её необходимо добавить из оригинального источника перед публикацией задания ученикам.</div>' : ''}
    <div class="answer-line">
      <input class="answer-input" id="input-${number}" type="text"
        placeholder="Введите краткий ответ"
        value="${escapeAttr(saved.value || "")}"
        autocomplete="off">
      <button class="check-btn" onclick="checkAnswer(${number})">Проверить</button>
      <button class="show-btn" onclick="showAnswer(${number})">Показать ответ</button>
    </div>
    <div class="feedback ${saved.correct ? 'correct' : ''}" id="feedback-${number}">
      ${saved.correct ? 'Верно! Ответ засчитан.' : ''}
    </div>
    <div class="answer-reveal" id="reveal-${number}">
      <strong>Ответ:</strong> ${answer.replaceAll("; ", " / ")}
    </div>
   `;
   sectionEl.appendChild(article);
  });

  root.appendChild(sectionEl);
 });

 updateStats();
}

function escapeAttr(value){
 return String(value).replaceAll("&","&amp;").replaceAll('"',"&quot;")
  .replaceAll("<","&lt;").replaceAll(">","&gt;");
}

function findTask(number){
 for(const section of sections){
  const task = section.tasks.find(item=>item[0]===number);
  if(task) return task;
 }
 return null;
}

function checkAnswer(number){
 const task = findTask(number);
 if(!task) return;
 const input = document.getElementById("input-"+number);
 const feedback = document.getElementById("feedback-"+number);
 const userAnswer = input.value;
 const correct = isCorrect(userAnswer,task[3]);

 progress[number] = {
  value:userAnswer,
  correct:correct,
  attempted:true
 };
 saveProgress();

 if(correct){
  feedback.className = "feedback correct";
  feedback.textContent = "Верно! Ответ засчитан.";
 } else {
  feedback.className = "feedback wrong";
  feedback.textContent = userAnswer.trim()
   ? "Пока неверно. Попробуйте ещё раз или откройте правильный ответ."
   : "Сначала введите свой ответ.";
 }
 updateStats();
}

function showAnswer(number){
 const task = findTask(number);
 if(!task) return;
 const reveal = document.getElementById("reveal-"+number);
 reveal.style.display = reveal.style.display === "block" ? "none" : "block";
}

function saveProgress(){
 try { localStorage.setItem(storageKey,JSON.stringify(progress)); }
 catch(e) {}
}

function updateStats(){
 let solved = 0;
 let correct = 0;
 for(const key in progress){
  if(progress[key].attempted) solved++;
  if(progress[key].correct) correct++;
 }
 document.getElementById("stats").textContent =
  `Решено: ${solved} из 70 · Верно: ${correct}`;
 document.getElementById("progressFill").style.width =
  (correct/70*100)+"%";
}

function resetProgress(){
 if(!confirm("Сбросить все сохранённые ответы и результаты?")) return;
 progress = {};
 saveProgress();
 render();
}

render();
</script>
</body>
</html>
