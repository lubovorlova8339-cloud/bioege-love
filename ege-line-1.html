const sectionNames=[

const KEY="bioege_line1_progress_v2";
let saved={};
try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){saved={}}

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function norm(s){
 return String(s||"").toLowerCase().replace(/ё/g,"е")
 .replace(/[.,;:!?()«»"'’—–-]/g," ")
 .replace(/\s+/g," ").trim();
}

function render(){
 const root=document.getElementById("tasks");
 root.innerHTML="";
 sectionNames.forEach((name,index)=>{
  const heading=document.createElement("h2");
  heading.className="section-title";
  heading.textContent=name;
  root.appendChild(heading);
  tasks.filter(t=>t.s===index).forEach(t=>{
   const card=document.createElement("article");
   card.className="card"+(saved[t.n]?.ok?" done":"");
   card.id="q"+t.n;
   const rows=t.r.map(row=>`<tr><td>${esc(row[0])}</td><td>${esc(row[1])}</td></tr>`).join("");
   const image=t.v?`<div class="visual">${illustration(t.v,t.n)}
    <div class="caption">Учебная схематичная иллюстрация. Не является оригинальным рисунком ФИПИ.</div>
    </div>`:"";
   card.innerHTML=`
    <div class="qtop"><span class="num">Задание ${t.n}</span>
    <span class="tag">Линия 1</span></div>
    <p class="prompt">Рассмотрите таблицу «${esc(t.h[0])}». Запишите пропущенный термин, обозначенный вопросительным знаком.</p>
    <table><thead><tr><th>${esc(t.h[0])}</th><th>${esc(t.h[1])}</th></tr></thead>
    <tbody>${rows}</tbody></table>
    ${image}
    <div class="answer-row">
     <input id="a${t.n}" placeholder="Введите ответ" autocomplete="off"
      value="${esc(saved[t.n]?.value||"")}"
      onkeydown="if(event.key==='Enter')check(${t.n})">
     <button class="primary" onclick="check(${t.n})">Проверить</button>
     <button class="secondary" onclick="reveal(${t.n})">Показать ответ</button>
    </div>
    <div class="feedback" id="f${t.n}"></div>
    <div class="reveal" id="r${t.n}">Ответ: <b>${esc(t.a.split(";")[0])}</b></div>`;
   root.appendChild(card);
  });
 });
 updateProgress();
}

function check(n){
 const t=tasks.find(x=>x.n===n);
 const value=document.getElementById("a"+n).value;
 const accepted=t.a.split(";").map(norm);
 const ok=accepted.includes(norm(value));
 saved[n]={value:value,ok:ok};
 localStorage.setItem(KEY,JSON.stringify(saved));
 const feedback=document.getElementById("f"+n);
 feedback.className="feedback "+(ok?"correct":"wrong");
 feedback.textContent=ok?"Верно! Отличная работа.":"Ответ пока не совпадает с ключом. Попробуйте ещё раз.";
 document.getElementById("q"+n).classList.toggle("done",ok);
 updateProgress();
}
function reveal(n){
 document.getElementById("r"+n).style.display="block";
}
function toggleAnswers(){
 document.querySelectorAll(".reveal").forEach(el=>{
  el.style.display=el.style.display==="block"?"none":"block";
 });
}
function updateProgress(){
 const count=tasks.filter(t=>saved[t.n]?.ok).length;
 document.getElementById("progress").textContent="Выполнено: "+count+" из 70";
}
function resetProgress(){
 if(!confirm("Сбросить все ответы и прогресс?"))return;
 saved={};
 localStorage.removeItem(KEY);
 render();
}
render();
</script>
